# Liquid glass pour kitty — retirer la ligne « include liquid-glass.conf » de kitty.conf pour revenir en arrière.
# Le flou et le liseré lumineux viennent de Hyprland (règles « kitty » dans hypr/hyprland/rules.lua).

# Fond en verre : seul le fond est translucide, le texte reste 100 % net
background_opacity          0.68
dynamic_background_opacity  yes

# Les fonds colorés des applis (nvim, btop, fzf…) deviennent aussi du verre, un peu plus teinté
transparent_background_colors #1E1E2E@0.55 #181825@0.55 #313244@0.65 #45475A@0.7

# Barre d'onglets fondue dans le verre
tab_bar_background          none
tab_bar_margin_color        none
inactive_tab_background     #1E1E2E
inactive_tab_foreground     #A6ADC8
active_tab_background       #CBA6F7
active_tab_foreground       #11111B

# Plus d'air autour du texte, comme une fenêtre macOS
window_padding_width        14 18
single_window_padding_width 14 18

# Séparateurs entre panneaux kitty : fins et lumineux
window_border_width         1px
active_border_color         #6C7086
inactive_border_color       #313244

# Fenêtres inactives légèrement estompées
inactive_text_alpha         0.72
