# ==============================================================================
#                    🐱 KITTY — CONFIGURATION ULTIME
# ==============================================================================
# Fichiers :
#   kitty.conf                  réglages principaux (ce fichier)
#   theme.conf                  couleurs Catppuccin Mocha
#   keys.conf                   tous les raccourcis
#   tab_bar.py                  barre d'onglets maison (icônes + horloge + batterie)
#   quick-access-terminal.conf  terminal déroulant (Super+`)
#   sessions/*.kitty-session    espaces de travail prêts à l'emploi
#   liquid-glass.conf           effet verre (à retirer pour revenir au style normal)
# Recharger : Ctrl+Maj+R   ·   Palette de commandes : Ctrl+Maj+Alt+P

# --- Shell -------------------------------------------------------------------
# shell : celui de ta session (fish, zsh, bash…)
# Intégration shell : saut entre prompts, sortie de la dernière commande,
# nouvel onglet dans le même dossier, curseur en barre au prompt…
shell_integration enabled

# --- Police & typographie -----------------------------------------------------
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Ligatures (sauf sous le curseur, pour éditer sans surprise)
disable_ligatures cursor
# Chiffres barrés 0, et variantes stylistiques de JetBrains Mono
font_features JetBrainsMonoNF-Regular +zero +ss01 +cv06
font_features JetBrainsMonoNF-Bold    +zero +ss01 +cv06
# Un peu plus d'interligne, plus lisible
modify_font cell_height 108%
# Soulignés ondulés (erreurs nvim, LSP) plus jolis
undercurl_style thick-sparse
text_composition_strategy platform

# --- Fenêtres & disposition --------------------------------------------------
enabled_layouts splits,tall,fat,grid,horizontal,vertical,stack

window_padding_width        12 16
window_margin_width         0
single_window_padding_width 12 16
window_border_width         1.5pt
draw_minimal_borders        yes
placement_strategy          center
hide_window_decorations     yes
confirm_os_window_close     -1
remember_window_size        yes
initial_window_width        1060
initial_window_height       680
inactive_text_alpha         0.80
# Lettres affichées pour choisir un panneau (focus / échange)
visual_window_select_characters AZERTYUIOPQSDFGHJKLM

# --- Verre ----------------------------------------------------------------------
background_opacity          0.88
background_blur             32
dynamic_background_opacity  yes

# --- Curseur avec traînée animée --------------------------------------------
cursor_shape                 beam
cursor_shape_unfocused       hollow
cursor_beam_thickness        1.8
cursor_blink_interval        0.5 ease-in-out
cursor_stop_blinking_after   15.0
cursor_trail                 3
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2

# --- Historique & barre de défilement ---------------------------------------
scrollback_lines              20000
# Historique étendu (en Mo) visible dans le pager (Ctrl+Maj+H)
scrollback_pager_history_size 256
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollbar                     scrolled
scrollbar_interactive         yes
scrollbar_jump_on_click       yes
scrollbar_width               0.5
scrollbar_hover_width         1
scrollbar_handle_opacity      0.6
scrollbar_radius              0.3
wheel_scroll_multiplier       3.0
wheel_scroll_min_lines        1
touch_scroll_multiplier       2.0

# --- Souris, liens & sélection ----------------------------------------------
mouse_hide_wait              3.0
url_style                    curly
open_url_with                default
detect_urls                  yes
show_hyperlink_targets       yes
underline_hyperlinks         hover
url_prefixes                 file ftp ftps git hdfs http https irc ircs mailto nfs sftp ssh
url_excluded_characters      ›»
copy_on_select               yes
strip_trailing_spaces        smart
select_by_word_characters    @-./_~?&=%+#:

# Clic : ouvre le lien ; Ctrl+clic : ouvre le lien même dans nvim/htop
mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left click ungrabbed mouse_handle_click link
mouse_map ctrl+left press ungrabbed,grabbed mouse_discard_event
# Clic droit : sélectionne toute la sortie de la commande sous la souris
mouse_map ctrl+right press ungrabbed mouse_select_command_output

# --- Presse-papier & collage sûr --------------------------------------------
clipboard_control      write-clipboard write-primary read-clipboard-ask read-primary-ask
clipboard_max_size     512
# Colle les URL entre guillemets au prompt, demande confirmation si énorme
paste_actions          quote-urls-at-prompt,confirm-if-large

# --- Notifications & cloche -------------------------------------------------
enable_audio_bell      no
visual_bell_duration   0.0
window_alert_on_bell   yes
bell_on_tab            "󰂞 "
# Notification bureau quand une commande de plus de 10 s se termine
# pendant que la fenêtre n'a pas le focus
notify_on_cmd_finish   invisible 10.0

# --- Barre d'onglets (en bas, pilules arrondies + statut à droite) ----------
tab_bar_edge                bottom
tab_bar_style               custom
tab_powerline_style         round
tab_bar_align               left
tab_bar_min_tabs            1
tab_switch_strategy         previous
tab_bar_margin_width        6
tab_bar_margin_height       6 4
tab_activity_symbol         "● "
tab_title_max_length        28
tab_title_template          "{index} {title}"
active_tab_title_template   "{index} {title}{' 󰊓' if layout_name == 'stack' and num_windows > 1 else ''}"
active_tab_font_style       bold
inactive_tab_font_style     normal

# --- Contrôle à distance & sessions -----------------------------------------
# Permet `kitten @ …` depuis les terminaux kitty (scripts, nvim, sessions)
allow_remote_control   socket-only
listen_on              unix:@kitty-{kitty_pid}
# Kitty démarre toujours dans la session "principal" si tu le lances seul
# startup_session      sessions/dev.kitty-session

# --- Divers ------------------------------------------------------------------
update_check_interval  0
term                   xterm-kitty
allow_hyperlinks       yes

# --- Performance -------------------------------------------------------------
repaint_delay        8
input_delay          2
sync_to_monitor      yes

# --- Modules ------------------------------------------------------------------
include theme.conf
include keys.conf

# Liquid glass (retirer cette ligne pour revenir au style normal)
include liquid-glass.conf
