# ==============================================================================
#                      🐱 KITTY ULTRA APEX CONFIGURATION
# ==============================================================================

# --- Shell ---
# shell : celui de ta session (fish, zsh, bash…)

# --- Fonts & Typography ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Ligatures enabled
disable_ligatures never

# --- Window Layouts & Multiplexing (Côte à côte / Grille) ---
enabled_layouts splits,tall,fat,grid,stack

# Window padding & borders
window_padding_width        12 16
window_margin_width         0
single_window_padding_width 12 16
window_border_width         1.5pt
draw_minimal_borders        yes
placement_strategy          center
hide_window_decorations     yes
confirm_os_window_close     1
remember_window_size        yes
initial_window_width        1060
initial_window_height       680

# Atténuer légèrement les panneaux inactifs pour focus visuel
inactive_text_alpha         0.80

# --- Background & Opacity (Glass Effect) ---
background_opacity          0.88
background_blur             32
dynamic_background_opacity  yes

# --- Cursor & Modern Smooth Trail ---
cursor_shape                 beam
cursor_beam_thickness        1.8
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0

# Kitty Cursor Trail (Animation fluide moderne)
cursor_trail                 3
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2

# --- Scrollback & Mouse ---
scrollback_lines             10000
wheel_scroll_multiplier      3.0
touch_scroll_multiplier      2.0
mouse_hide_wait              3.0
url_style                    curly
open_url_with               default
detect_urls                  yes
underline_hyperlinks         hover
url_prefixes                 file ftp ftps git hdfs http https irc ircs mailto nfs sftp ssh
copy_on_select               yes
strip_trailing_spaces        smart

# Clic pour ouvrir directement le lien dans Chrome
mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left click ungrabbed mouse_handle_click link

# --- Audio & Bell ---
enable_audio_bell            no
visual_bell_duration         0.0
window_alert_on_bell         yes
bell_on_tab                  "🔔 "

# ==============================================================================
# 🚀 BARRE D'ONGLETS EN BAS (ULTRA MODERNE POWERLINE)
# ==============================================================================
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_align               left
tab_bar_min_tabs            1
tab_switch_strategy         previous
tab_bar_margin_width        6
tab_bar_margin_height       6 4

# Template dynamique des onglets avec icônes Nerd Font
tab_title_template          "  {index}  {title} "
active_tab_title_template   " 󰞌 {index}  {title} "
active_tab_font_style       bold
inactive_tab_font_style     normal

# ==============================================================================
# 🎨 PALETTE DE COULEURS (CATPPUCCIN MOCHA DEEP APEX)
# ==============================================================================
foreground                  #CDD6F4
background                  #11111B
selection_foreground        #11111B
selection_background        #F5E0DC

# Curseur
cursor                      #F5E0DC
cursor_text_color           #11111B

# URLs
url_color                   #89B4FA

# Bordures des fenêtres côte à côte
active_border_color         #CBA6F7
inactive_border_color       #313244
bell_border_color           #F9E2AF

# Barre d'onglets (Bas)
active_tab_foreground       #11111B
active_tab_background       #CBA6F7
inactive_tab_foreground     #A6ADC8
inactive_tab_background     #1E1E2E
tab_bar_background          #11111B

# 16 Couleurs ANSI
color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

# ==============================================================================
# ⌨️ RACCOURCIS CLAVIER INTUITIFS & PUISSANTS
# ==============================================================================

# --- Gestion des panneaux CÔTE À CÔTE (Splits) ---
# Ouvrir un terminal côte à côte (vertical)
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+d     launch --location=vsplit --cwd=current

# Ouvrir un terminal en dessous (horizontal)
map ctrl+shift+s     launch --location=hsplit --cwd=current

# Fermer le panneau actif
map ctrl+shift+w     close_window

# Zoomer / Plein écran sur le panneau actuel (Toggle Stack layout)
map ctrl+shift+z     toggle_layout stack

# Changer de disposition (splits <-> grid <-> tall <-> fat)
map ctrl+shift+l     next_layout

# --- Navigation entre panneaux côte à côte ---
map alt+left         neighboring_window left
map alt+right        neighboring_window right
map alt+up           neighboring_window up
map alt+down         neighboring_window down

map ctrl+shift+h     neighboring_window left
map ctrl+shift+j     neighboring_window down
map ctrl+shift+k     neighboring_window up
map ctrl+shift+right neighboring_window right

# --- Redimensionnement des panneaux ---
map ctrl+alt+left    resize_window narrower 3
map ctrl+alt+right   resize_window wider 3
map ctrl+alt+up      resize_window taller 3
map ctrl+alt+down    resize_window shorter 3
map ctrl+alt+home    resize_window reset

# --- Gestion des Onglets (Tabs) ---
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+q     close_tab
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+alt+t set_tab_title
map ctrl+shift+i     set_tab_title
map f2               set_tab_title
map ctrl+1           goto_tab 1
map ctrl+2           goto_tab 2
map ctrl+3           goto_tab 3
map ctrl+4           goto_tab 4
map ctrl+5           goto_tab 5

# --- Presse-papier & Zoom Police ---
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
map ctrl+shift+r     load_config_file

# --- Performance & Synchronisation ---
repaint_delay        10
input_delay          3
sync_to_monitor      yes

# Liquid glass (retirer cette ligne pour revenir au style normal)
include liquid-glass.conf
