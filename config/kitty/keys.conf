# ==============================================================================
# ⌨️  RACCOURCIS — tous visibles et cherchables dans la palette : Ctrl+Maj+Alt+P
# ==============================================================================

# --- Panneaux (splits) --------------------------------------------------------
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+d     launch --location=vsplit --cwd=current
map ctrl+shift+s     launch --location=hsplit --cwd=current
map ctrl+shift+w     close_window
# Zoom sur le panneau actif (plein onglet) / retour
map ctrl+shift+z     toggle_layout stack
map ctrl+shift+l     next_layout
# Tourner le split (côte à côte <-> dessus/dessous)
map ctrl+shift+alt+r layout_action rotate
# Choisir un panneau par une lettre / l'échanger avec l'actif
map ctrl+shift+f7    focus_visible_window
map ctrl+shift+x     swap_with_window
# Sortir le panneau dans un nouvel onglet / choisir où l'envoyer
map ctrl+shift+alt+d detach_window new-tab
map ctrl+shift+alt+a detach_window ask

# Navigation
map alt+left         neighboring_window left
map alt+right        neighboring_window right
map alt+up           neighboring_window up
map alt+down         neighboring_window down
map ctrl+shift+h     neighboring_window left
map ctrl+shift+j     neighboring_window down
map ctrl+shift+k     neighboring_window up
map ctrl+shift+right neighboring_window right
map ctrl+shift+left  neighboring_window left
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Déplacer le panneau actif dans la disposition
map shift+alt+left   move_window left
map shift+alt+right  move_window right
map shift+alt+up     move_window up
map shift+alt+down   move_window down

# Redimensionner
map ctrl+alt+left    resize_window narrower 3
map ctrl+alt+right   resize_window wider 3
map ctrl+alt+up      resize_window taller 3
map ctrl+alt+down    resize_window shorter 3
map ctrl+alt+home    resize_window reset

# --- Onglets --------------------------------------------------------------------
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+q     close_tab
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+i     set_tab_title
map ctrl+shift+alt+t set_tab_title
map f2               set_tab_title
map ctrl+shift+o     select_tab
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+alt+left  previous_tab
map ctrl+shift+alt+right next_tab
# Revenir à l'onglet précédent (comme Alt+Tab)
map ctrl+shift+backspace goto_tab -1
map ctrl+1           goto_tab 1
map ctrl+2           goto_tab 2
map ctrl+3           goto_tab 3
map ctrl+4           goto_tab 4
map ctrl+5           goto_tab 5
map ctrl+6           goto_tab 6
map ctrl+7           goto_tab 7
map ctrl+8           goto_tab 8
map ctrl+9           goto_tab 99

# --- Fenêtres kitty -------------------------------------------------------------
map ctrl+shift+n     new_os_window_with_cwd
map f11              toggle_fullscreen

# --- Historique, recherche, sortie des commandes ----------------------------
# Recherche intégrée dans l'historique
map ctrl+shift+f     search_scrollback
# Recherche floue (fzf) dans tout l'historique
map ctrl+shift+alt+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --tac --exact --no-mouse --prompt "  historique › " --bind "enter:execute-silent(echo -n {} | wl-copy)+abort"
# Historique complet dans le pager / dans nvim
map ctrl+shift+alt+h show_scrollback
map ctrl+shift+alt+v launch --type=overlay --stdin-source=@screen_scrollback nvim -R -c "set nonumber norelativenumber signcolumn=no laststatus=0 | normal G" -
# Sortie de la dernière commande (pager) / la copier
map ctrl+shift+g     show_last_command_output
map ctrl+shift+alt+g launch --type=overlay --stdin-source=@last_cmd_output sh -c "wl-copy && kitten notify 'kitty' 'Sortie de la dernière commande copiée'"
# Sauter de prompt en prompt
map ctrl+shift+alt+up   scroll_to_prompt -1
map ctrl+shift+alt+down scroll_to_prompt 1
# Effacer l'écran en gardant la ligne courante (comme Cmd+K sur macOS)
map ctrl+shift+alt+l clear_terminal to_cursor active

# --- Hints : sélectionner du texte à l'écran au clavier ----------------------
# Ctrl+Maj+E : ouvrir un lien (défaut)
map ctrl+shift+e     open_url_with_hints
# Ctrl+Maj+P puis… (chaînes par défaut de kitty conservées : f, l, w, h, y)
map ctrl+shift+p>f   kitten hints --type path --program -
map ctrl+shift+p>o   kitten hints --type path
map ctrl+shift+p>l   kitten hints --type line --program -
map ctrl+shift+p>w   kitten hints --type word --program -
map ctrl+shift+p>h   kitten hints --type hash --program -
map ctrl+shift+p>i   kitten hints --type ip --program -
map ctrl+shift+p>y   kitten hints --type hyperlink
# Copier directement dans le presse-papier (mot / chemin / ligne / URL)
map ctrl+shift+p>c   kitten hints --type word --program @
map ctrl+shift+p>shift+f kitten hints --type path --program @
map ctrl+shift+p>shift+l kitten hints --type line --program @
map ctrl+shift+p>u   kitten hints --type url --program @
# fichier:ligne (erreurs de compilation, grep, rg…) → ouvre nvim à la bonne ligne
map ctrl+shift+p>n   kitten hints --type linenum --linenum-action=tab nvim +{line} {path}

# --- Presse-papier & police -------------------------------------------------
map ctrl+shift+c     copy_to_clipboard
map ctrl+shift+v     paste_from_clipboard
map shift+insert     paste_from_selection
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# --- Verre à la volée (Ctrl+Maj+A puis…) -------------------------------------
map ctrl+shift+a>m   set_background_opacity +0.05
map ctrl+shift+a>l   set_background_opacity -0.05
map ctrl+shift+a>1   set_background_opacity 1
map ctrl+shift+a>d   set_background_opacity default

# --- Outils -------------------------------------------------------------------------
# Palette de commandes : cherche et lance n'importe quelle action / raccourci
map ctrl+shift+alt+p command_palette
map ctrl+shift+f3    command_palette
# Taper la même chose dans tous les panneaux de l'onglet
map ctrl+shift+b     launch --allow-remote-control kitten broadcast --match-tab state:focused
# Surligner ERROR / WARN / OK dans les logs (Ctrl+Maj+M pour basculer)
map ctrl+shift+m     toggle_marker iregex 1 \\b(error|erreur|fail(ed)?|fatal|panic)\\b 2 \\bwarn(ing)?\\b 3 \\b(ok|pass(ed)?|success|done)\\b
# Emoji / caractères Unicode
map ctrl+shift+u     kitten unicode_input
# Changer de thème de couleurs
map ctrl+shift+f12   kitten themes
# Lazygit (nouvel onglet, dossier courant) / btop (par-dessus)
map ctrl+shift+alt+y launch --type=tab --cwd=current --tab-title " lazygit" lazygit
map ctrl+shift+alt+b launch --type=overlay btop
# Éditer / recharger la config
map ctrl+shift+f2    edit_config_file
map ctrl+shift+r     load_config_file
# Débogage : touches envoyées / config effective
map ctrl+shift+f6    debug_config

# --- Sessions (espaces de travail) ------------------------------------------
# Choisir une session dans ~/.config/kitty/sessions (la crée si besoin)
map ctrl+shift+alt+o goto_session sessions
# Revenir à la session précédente
map ctrl+shift+alt+backspace goto_session -1
# Enregistrer l'état actuel (onglets, splits, dossiers, programmes) comme session
map ctrl+shift+alt+s save_as_session --relocatable --use-foreground-process --base-dir ~/.config/kitty/sessions
