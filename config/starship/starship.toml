# ==============================================================================
#            ✦ STARSHIP — CATPPUCCIN MOCHA · POWERLINE CAPSULES ✦
# ==============================================================================
#  ╭─ [󰣇 user] [ dir] [ branch status] ─────────── [langs 󱦟 ✘] [ 20:18]
#  ╰─❯
# ==============================================================================

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "mocha"
command_timeout = 800

format = """
[╭─](surface2)\
[](mauve)$os$username$hostname[](fg:mauve bg:blue)\
$directory[](fg:blue bg:surface0)\
$git_branch$git_state$git_status[](fg:surface0)\
$fill\
[](fg:surface0)\
$docker_context$nodejs$python$rust$golang$dart$c$cmake$java$kotlin$lua$ruby$swift$deno$package\
$cmd_duration$status$jobs\
[](fg:lavender bg:surface0)$time[](fg:lavender)
[╰─](surface2)$character"""

right_format = ""
continuation_prompt = "[  ∙ ](surface2)"

[palettes.mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ─── Ligne de liaison entre gauche et droite ───────────────────────────────────
[fill]
symbol = "─"
style = "surface1"

# ─── Capsule 1 : distribution + utilisateur ────────────────────────────────────
[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold fg:crust bg:mauve"

[os.symbols]
Arch = "󰣇"
EndeavourOS = "󰣇"
Ubuntu = "󰕈"
Debian = "󰣚"
Fedora = "󰣛"
Linux = "󰌽"
Macos = "󰀵"

[username]
show_always = true
format = "[$user ]($style)"
style_user = "bold fg:crust bg:mauve"
style_root = "bold fg:red bg:mauve"

[hostname]
ssh_only = true
ssh_symbol = "󰌘 "
format = "[@$hostname $ssh_symbol]($style)"
style = "bold fg:crust bg:mauve"

# ─── Capsule 2 : répertoire ────────────────────────────────────────────────────
[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:crust bg:blue"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "󰋜 ~"
read_only = "󰌾 "
read_only_style = "bold fg:red bg:blue"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Téléchargements" = " Téléchargements"
"Downloads" = " Downloads"
"Musique" = "󰝚 Musique"
"Music" = "󰝚 Music"
"Images" = "󰈟 Images"
"Pictures" = "󰈟 Pictures"
"Vidéos" = "󰕧 Vidéos"
"development" = "󰅩 development"
".config" = " .config"

# ─── Capsule 3 : git ───────────────────────────────────────────────────────────
[git_branch]
symbol = ""
format = "[ $symbol $branch(:$remote_branch) ]($style)"
style = "bold fg:mauve bg:surface0"
truncation_length = 24
truncation_symbol = "…"

[git_state]
format = "[\\($state( $progress_current/$progress_total)\\) ]($style)"
style = "bold fg:peach bg:surface0"

[git_status]
format = "([$all_status$ahead_behind ]($style))"
style = "bold fg:yellow bg:surface0"
conflicted = "[󰇇 $count ](fg:red bg:surface0)"
ahead = "[⇡$count ](fg:green bg:surface0)"
behind = "[⇣$count ](fg:red bg:surface0)"
diverged = "[⇡$ahead_count⇣$behind_count ](fg:peach bg:surface0)"
up_to_date = "[ ](fg:green bg:surface0)"
untracked = "[?$count ](fg:subtext0 bg:surface0)"
stashed = "[󰮯 $count ](fg:lavender bg:surface0)"
modified = "[!$count ](fg:yellow bg:surface0)"
staged = "[+$count ](fg:green bg:surface0)"
renamed = "[»$count ](fg:sky bg:surface0)"
deleted = "[✘$count ](fg:red bg:surface0)"

# ─── Capsule droite : langages / outils ────────────────────────────────────────
[nodejs]
symbol = "󰎙"
format = "[ $symbol $version ]($style)"
style = "fg:green bg:surface0"

[python]
symbol = ""
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"
style = "fg:yellow bg:surface0"

[rust]
symbol = "󱘗"
format = "[ $symbol $version ]($style)"
style = "fg:maroon bg:surface0"

[golang]
symbol = "󰟓"
format = "[ $symbol $version ]($style)"
style = "fg:sky bg:surface0"

[dart]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:sapphire bg:surface0"

[c]
symbol = "󰙱"
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:surface0"

[cmake]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:pink bg:surface0"

[java]
symbol = "󰬷"
format = "[ $symbol $version ]($style)"
style = "fg:red bg:surface0"

[kotlin]
symbol = "󱈙"
format = "[ $symbol $version ]($style)"
style = "fg:mauve bg:surface0"

[lua]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:blue bg:surface0"

[ruby]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:red bg:surface0"

[swift]
symbol = "󰛥"
format = "[ $symbol $version ]($style)"
style = "fg:peach bg:surface0"

[deno]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:teal bg:surface0"

[package]
symbol = "󰏗"
format = "[ $symbol $version ]($style)"
style = "fg:rosewater bg:surface0"

[docker_context]
symbol = "󰡨"
format = "[ $symbol $context ]($style)"
style = "fg:blue bg:surface0"

# ─── Durée, code de sortie, tâches ─────────────────────────────────────────────
[cmd_duration]
min_time = 1500
format = "[ 󱦟 $duration ]($style)"
style = "bold fg:peach bg:surface0"

[status]
disabled = false
format = "[ $symbol$status ]($style)"
symbol = "✘ "
not_executable_symbol = " "
not_found_symbol = "󰍉 "
sigint_symbol = "󰩘 "
signal_symbol = "⚡"
map_symbol = true
style = "bold fg:red bg:surface0"

[jobs]
number_threshold = 1
symbol = "󰅩"
format = "[ $symbol $number ]($style)"
style = "bold fg:teal bg:surface0"

# ─── Capsule horloge ───────────────────────────────────────────────────────────
[time]
disabled = false
format = "[ 󰥔 $time ]($style)"
time_format = "%R"
style = "bold fg:crust bg:lavender"

# ─── Invite de saisie ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)[❯](bold teal)[❯](bold sky)"
error_symbol = "[❯](bold red)[❯](bold maroon)[❯](bold peach)"
vimcmd_symbol = "[❮](bold blue)[❮](bold lavender)[❮](bold mauve)"
vimcmd_replace_one_symbol = "[❮❮❮](bold yellow)"
vimcmd_replace_symbol = "[❮❮❮](bold yellow)"
vimcmd_visual_symbol = "[❮❮❮](bold mauve)"
