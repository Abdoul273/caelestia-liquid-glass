name: Feature Request
description: Suggest an improvement, new Island page, or localization support
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use Case
      description: Why would this be useful for Caelestia · Liquid Glass users?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional Context
      description: Mockups, references, or implementation ideas (optional).
